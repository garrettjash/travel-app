# Refresh places whose attractions haven't been updated in 3+ months
# Example: If Los Angeles (LA) last refresh was >90 days ago, scrapes fresh data
# and updates all LA attractions.
name: Refresh Stale Places

on:
  workflow_dispatch:
    inputs:
      limit:
        type: string
        description: "Max places to refresh this run (default: 3)"
        required: false
        default: "3"
      stale_days:
        type: string
        description: "Consider stale if last refresh > N days ago (default: 90)"
        required: false
        default: "90"
  workflow_call:
    inputs:
      limit:
        type: string
        required: false
        default: "3"
      stale_days:
        type: string
        required: false
        default: "90"

jobs:
  refresh:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Refresh stale places
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TA_API_KEY: ${{ secrets.TA_API_KEY }}
          GEO_PROVIDER: ${{ secrets.GEO_PROVIDER }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          S3_IMG_BUCKET_NAME: ${{ secrets.S3_IMG_BUCKET_NAME }}
          REFRESH_STALE_DAYS: ${{ inputs.stale_days || github.event.inputs.stale_days || '90' }}
          REFRESH_STALE_LIMIT: ${{ inputs.limit || github.event.inputs.limit || '3' }}
        run: |
          set -e
          python -u ai_database/refresh_stale_places.py

# End-to-end pipeline test: 1 TA request, 1 web scrape, S3 upload, AI processing
# Run manually via workflow_dispatch to verify the full pipeline works
name: Test Pipeline (E2E)

on:
  workflow_dispatch:

jobs:
  ta_scrape:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Debug - verify environment
        env:
          TA_API_KEY: ${{ secrets.TA_API_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          echo "TA_API_KEY: $([ -n \"$TA_API_KEY\" ] && echo 'set' || echo 'MISSING')"
          echo "S3_BUCKET_NAME: $([ -n \"$S3_BUCKET_NAME\" ] && echo 'set' || echo 'MISSING')"
          echo "AWS_ACCESS_KEY_ID: $([ -n \"$AWS_ACCESS_KEY_ID\" ] && echo 'set' || echo 'MISSING')"

      - name: Run TripAdvisor scraper (1 attraction)
        env:
          TA_API_KEY: ${{ secrets.TA_API_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          TA_DAILY_LIMIT: "1"
          TA_NON_INTERACTIVE: "1"
          TA_SEED_PLACE: "Paris, France"
          TA_WEB_SCRAPER_LIMIT: "0"
        run: |
          set -e
          python -u data/TripAdvisor/ta_scraper.py

  web_scrape:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Debug - verify environment
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          echo "S3_BUCKET_NAME: $([ -n \"$S3_BUCKET_NAME\" ] && echo 'set' || echo 'MISSING')"
          echo "SUPABASE_URL: $([ -n \"$SUPABASE_URL\" ] && echo 'set' || echo 'MISSING')"
          echo "AWS_ACCESS_KEY_ID: $([ -n \"$AWS_ACCESS_KEY_ID\" ] && echo 'set' || echo 'MISSING')"
          echo "Chrome: $(which google-chrome 2>/dev/null || which chromium-browser 2>/dev/null || echo 'not found')"

      - name: Run web scraper (1 article)
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAIN_SCRAPER_DESTINATION: "Paris, France"
          MAIN_SCRAPER_WEB_ONLY: "1"
          MAIN_SCRAPER_ARTICLE_LIMIT: "1"
          MAIN_SCRAPER_FORCE_REFRESH: "1"
        run: |
          set -e
          python -u "web_scraper/code/1. main_scraper.py"

  ai_process:
    needs: [ta_scrape, web_scrape]
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Debug - verify environment
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          echo "S3_BUCKET_NAME: $([ -n \"$S3_BUCKET_NAME\" ] && echo 'set' || echo 'MISSING')"
          echo "OPENAI_API_KEY: $([ -n \"$OPENAI_API_KEY\" ] && echo 'set' || echo 'MISSING')"
          echo "SUPABASE_URL: $([ -n \"$SUPABASE_URL\" ] && echo 'set' || echo 'MISSING')"
          echo "Files in raw_scrapes/ (from previous jobs): will be processed"

      - name: Run AI processor
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEO_PROVIDER: ${{ secrets.GEO_PROVIDER }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -e
          python -u ai_database/ai_processor.py --force-refresh

name: Backfill Images (Manual)

on:
  workflow_dispatch:
    inputs:
      place:
        type: string
        description: "Optional attraction city filter (e.g. Cape Town). Leave blank for all cities."
        required: false
        default: ""
      limit:
        type: string
        description: "Optional max number of attractions to scan (blank = no limit)."
        required: false
        default: ""
      start_attraction_id:
        type: string
        description: "Optional resume cursor: start processing from this attraction_id (inclusive)."
        required: false
        default: ""
      dry_run:
        type: boolean
        description: "Preview only; no S3 or DB writes"
        required: false
        default: true
      allow_google_fallback:
        type: boolean
        description: "If true, use Google Places Photo only when Wikipedia/Wikimedia fail"
        required: false
        default: false

jobs:
  backfill_images:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run backfill_images
        env:
          S3_IMG_BUCKET_NAME: ${{ secrets.S3_IMG_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_IMAGE_MAX_WIDTH: ${{ vars.GOOGLE_IMAGE_MAX_WIDTH || '800' }}
          PLACE: ${{ github.event.inputs.place }}
          LIMIT: ${{ github.event.inputs.limit }}
          START_ATTRACTION_ID: ${{ github.event.inputs.start_attraction_id }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          ALLOW_GOOGLE_FALLBACK: ${{ github.event.inputs.allow_google_fallback }}
        run: |
          set -eo pipefail

          ARGS=()

          if [ -n "${PLACE}" ]; then
            ARGS+=(--place "${PLACE}")
          fi

          if [ -n "${LIMIT}" ]; then
            ARGS+=(--limit "${LIMIT}")
          fi

          if [ -n "${START_ATTRACTION_ID}" ]; then
            ARGS+=(--start-attraction-id "${START_ATTRACTION_ID}")
          fi

          if [ "${DRY_RUN}" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          if [ "${ALLOW_GOOGLE_FALLBACK}" = "true" ]; then
            ARGS+=(--allow-google-fallback)
          fi

          echo "GOOGLE_IMAGE_MAX_WIDTH=${GOOGLE_IMAGE_MAX_WIDTH}"
          echo "Running: python -u ai_database/3. backfill_images.py ${ARGS[*]}"
          python -u "ai_database/3. backfill_images.py" "${ARGS[@]}" | tee backfill_images.log

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-images-log-${{ github.run_id }}
          path: backfill_images.log
          if-no-files-found: warn
